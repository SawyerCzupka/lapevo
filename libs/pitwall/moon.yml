$schema: "../../.moon/cache/schemas/project.json"

layer: "library"
language: "rust"

tags:
  - "rust"
  - "telemetry"
  - "iracing"

dependsOn:
  - "pitwall-derive"

fileGroups:
  sources:
    - "src/**/*.rs"
  tests:
    - "tests/**/*.rs"
  benches:
    - "benches/**/*.rs"

tasks:
  bench:
    command: "cargo bench"
    inputs:
      - "src/**/*.rs"
      - "benches/**/*.rs"
      - "Cargo.toml"
    options:
      cache: false

# Inherits build, test, check, clippy, fmt from .moon/tasks/rust.yml
