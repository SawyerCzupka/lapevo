[package]
name = "lapevo-iracing"
version = "0.1.0"
edition = "2024"

[features]
default = []
live = []
pitwall = ["dep:pitwall", "dep:futures"]

[dependencies]
lapevo-telemetry = { path = "../lapevo-telemetry" }
tokio = { version = "1", features = ["sync", "rt", "time", "fs"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
pitwall = { path = "../pitwall", optional = true }
futures = { version = "0.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
