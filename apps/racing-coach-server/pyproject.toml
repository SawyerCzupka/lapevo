[project]
name = "racing-coach-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Sawyer", email = "sawyerczupka@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.1.0",
    "fastapi>=0.115.12",
    "fastapi-cli>=0.0.7",
    "pydantic-settings>=2.9.1",
    "python-multipart>=0.0.9",
    "racing-coach-core",
    "sqlalchemy[asyncio]>=2.0.40",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
]

[tool.uv.sources]
racing-coach-core = { path = "../../libs/racing-coach-core", editable = true }

[project.scripts]
racing-coach-admin = "racing_coach_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.36.1",
    "pyrefly>=0.46.0",
    "ruff>=0.15.2",
]
test = [
    "polyfactory>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.0.1",
    "testcontainers[postgres]>=4.13.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]
markers = [
    "unit: Unit tests that mock external dependencies",
    "integration: Integration tests that test components together",
    "slow: Tests that take a long time to run",
]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=racing_coach_server",
    "--cov-report=term-missing",
    "--cov-report=html",
]
